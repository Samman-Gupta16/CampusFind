
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFind - Items</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .search-panel {
            max-width: 1100px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .search-panel input,
        .search-panel select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        .items-container {
            max-width: 1100px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .items-container .dashboard-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .items-heading {
            max-width: 1100px;
            margin: 30px auto 10px;
            padding: 0 10px;
        }

        @media (max-width: 600px) {
            .search-panel,
            .items-container,
            .items-heading {
                margin-left: 12px;
                margin-right: 12px;
            }
        }
    </style>

</head>

<body class="dashboard-page">

    <nav class="navbar">

        <div class="logo">
            <span class="logo-icon">CF</span>
            <span>CampusFind</span>
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <button id="logoutBtn" type="button">Logout</button>
        </div>

    </nav>

    <main>

        <section class="items-heading">
            <h1 id="pageTitle">Campus Items</h1>
            <p>Search and explore lost and found items.</p>
        </section>

        <section class="search-panel">

            <input
                type="text"
                id="searchInput"
                placeholder="Search item..."
            >

            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>

            <input
                type="text"
                id="locationFilter"
                placeholder="Search location..."
            >

        </section>

        <p id="resultCount" style="text-align:center;">
            Loading items...
        </p>

        <section id="itemsContainer" class="items-container">
            Loading items...
        </section>

    </main>

    <script type="module" src="items.js"></script>

</body>
</html>
