
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CampusFind</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">CF</span>
            <span>CampusFind</span>
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="dashboard-container">

        <section class="section-heading">
            <h2>My Profile</h2>
            <p>Manage your student account details.</p>
        </section>

        <div class="dashboard-card">

            <div class="card-icon">👤</div>

            <h2 id="profileName">Loading...</h2>

            <p><strong>Email:</strong> <span id="profileEmail"></span></p>

            <p><strong>Student ID:</strong> <span id="profileStudentId"></span></p>

            <p><strong>Account Status:</strong> <span id="profileStatus"></span></p>

            <button type="button" id="editProfileBtn" hidden>
                Edit Profile
            </button>

            <div id="editProfileSection" hidden>

                <h3>Update Your Details</h3>

                <input
                    type="text"
                    id="fullNameInput"
                    placeholder="Enter Your Full Name"
                >

                <input
                    type="text"
                    id="studentIdInput"
                    placeholder="Enter Your Student ID"
                >

                <button type="button" id="saveProfileBtn">
                    Save Profile
                </button>

            </div>

            <p id="saveMessage"></p>

            <br>

            <a href="dashboard.html">← Back to Dashboard</a>

        </div>

    </main>

    <script type="module" src="profile.js"></script>

</body>
</html>
